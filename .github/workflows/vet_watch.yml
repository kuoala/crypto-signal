name: Weekly vet of watched channels

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Vet each watched channel (read-only, never posts)
        run: |
          echo "## $(date -u +%F)" >> vet_log.md
          for ch in $(python -c "import json;print(*json.load(open('watch_channels.json')))"); do
            python vet.py "$ch" 40 | tee -a vet_log.md || true
          done
      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vet_log.md
          git diff --cached --quiet || (git commit -m "chore: weekly vet log [skip ci]" && git pull --rebase && git push)
