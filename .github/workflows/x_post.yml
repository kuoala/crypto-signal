name: Post to X

on:
  schedule:            # 4 posts/day; random delay below keeps minutes human-looking
    - cron: "5 7 * * *"
    - cron: "10 12 * * *"
    - cron: "0 16 * * *"
    - cron: "15 20 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: pulse | tip | question | record
        default: tip

concurrency:
  group: x-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TELEGRAM_LINK: ${{ secrets.TELEGRAM_LINK }}
        run: |
          [ "${{ github.event_name }}" = schedule ] && sleep $((RANDOM % 1200))   # 0-20 min jitter, scheduled runs only
          if [ -n "${{ inputs.kind }}" ]; then K="${{ inputs.kind }}"; else
            case "$(date -u +%H)" in 07) K=pulse;; 12) K=tip;; 16) K=question;; *) K=record;; esac
          fi
          python x_poster.py "$K"
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add x_state.json
          git diff --cached --quiet || (git commit -m "chore: x state [skip ci]" && git pull --rebase && git push)
