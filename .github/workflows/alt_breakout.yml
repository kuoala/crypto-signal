name: Alt-Breakout (Rule A live, Rule B shadow)

on:
  schedule:
    # Hourly: GitHub drops/delays scheduled runs. Only the latest closed 4h bar is evaluated and a coin
    # can't be signalled twice (one position per coin), so extra runs are harmless and catch missed bars.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test_post:
        description: "Send one labelled test message to Telegram (no trade, no state)"
        type: boolean
        default: false

concurrency:
  group: alt-breakout
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python alt_breakout.py --selftest
      - name: Run pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python alt_breakout.py ${{ inputs.test_post && '--test-post' || '' }}
      - name: Commit state + log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in breakout_state.json breakout_log.jsonl; do [ -f $f ] && git add -f $f; done
          git commit -m "chore: alt-breakout state [skip ci]" || echo "no changes"
          git pull --rebase --autostash || true
          git push || echo "nothing to push"
