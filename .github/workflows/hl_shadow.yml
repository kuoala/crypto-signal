name: Hyperliquid leaderboard shadow

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: hl-shadow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python hl_shadow.py --run          # logs only, never posts
      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hl_shadow.jsonl hl_state.json
          git diff --cached --quiet || (git commit -m "chore: hl shadow log [skip ci]" && git pull --rebase && git push)
