name: Weekly Instagram Reel

# Monday 03:30 UTC: after the Monday 00:00 UTC weekly report (alt_breakout runs hourly and lags 1-3 h).
# Always keeps the MP4 + caption as an artifact. Publishes to Instagram (official API) only when the IG_* secrets
# exist and this isn't a dry run. The video is hosted for Instagram to fetch as a release asset of this public repo.
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, don't publish"
        type: boolean
        default: true

permissions:
  contents: write          # release asset that Instagram downloads the video from

env:
  OM_COMMIT: e01dbf433f46eeb91d39bf905e194162921019a3   # OpenMontage pinned; bump deliberately
  OM_DIR: ${{ github.workspace }}/../OpenMontage

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_IG: ${{ secrets.IG_ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: python weekly_video.py --selftest
      - name: OpenMontage (Remotion composer only)
        run: |
          git init -q "$OM_DIR" && cd "$OM_DIR"
          git remote add origin https://github.com/calesthio/OpenMontage.git
          git fetch -q --depth 1 origin "$OM_COMMIT" && git checkout -q FETCH_HEAD
          cd remotion-composer && npm ci --no-audit --no-fund && npx remotion browser ensure
      - uses: actions/cache@v4
        with:
          path: ~/.piper
          key: piper-en_US-ryan-high
      - name: Piper TTS (narration, local/offline)
        run: |
          pip install piper-tts==1.8.0
          [ -f ~/.piper/en_US-ryan-high.onnx ] || python -m piper.download_voices --download-dir ~/.piper en_US-ryan-high
      - name: Render
        env:
          INVITE_REELS_IG: ${{ vars.INVITE_REELS_IG }}
        run: python weekly_video.py
      - uses: actions/upload-artifact@v4
        if: hashFiles('weekly_video/kuoala_weekly.mp4') != ''
        with:
          name: weekly-reel
          path: |
            weekly_video/kuoala_weekly.mp4
            weekly_video/meta.json
          retention-days: 14
      - name: Publish to Instagram
        if: hashFiles('weekly_video/kuoala_weekly.mp4') != '' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && env.HAS_IG == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="reel-$(date -u +%Y-%m-%d)"
          gh release create "$tag" weekly_video/kuoala_weekly.mp4 --prerelease --title "$tag" --notes "Weekly Reel video (hosted for Instagram)" || gh release upload "$tag" weekly_video/kuoala_weekly.mp4 --clobber
          python instagram_upload.py --video-url "https://github.com/${{ github.repository }}/releases/download/$tag/kuoala_weekly.mp4"
