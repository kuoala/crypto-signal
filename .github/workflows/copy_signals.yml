name: Copy signals (erfann_finance)

# One quick pass per run (~1 billed min). A 6h polling loop here burned the whole free quota.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: copy-signals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Mirror signals 
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python copy_signals.py --run && python -c "import copy_signals as c; c.commit_state()"
