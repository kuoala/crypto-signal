name: Copy signals (erfann_finance)

# Real-time mirror: one job polls the source channel every 10s for ~5h50m, then relaunches itself.
# GitHub's cron is throttled to one run every few hours, so it is only a backup if the chain breaks.
# Free because the repo is public (unlimited Actions minutes).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: copy-signals
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Mirror signals (10s poll loop)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python copy_signals.py --loop 21000
      - name: Relaunch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/copy_signals.yml/dispatches" -d '{"ref":"main"}'
