name: Paper report (all sources)

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

concurrency:
  group: paper-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python paper_mirror.py 40          # replays new mirrored signals on candles; settled ones are cached
      - run: python paper_report.py > PAPER_REPORT.md   # logs only, never posts
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PAPER_REPORT.md paper_mirror.jsonl
          git diff --cached --quiet || (git commit -m "chore: paper report [skip ci]" && git pull --rebase && git push)
